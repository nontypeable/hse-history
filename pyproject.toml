[project]
name = "literature-history-bot"
version = "1.0.0"
description = "Interactive Telegram bot about Russian literature of the 19th and early 20th centuries"
requires-python = ">=3.14"
dependencies = [
    "python-telegram-bot>=21.0,<23",
    "socksio>=1.0,<2",
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bot/infrastructure/content/*" = ["RUF001", "E501"]
"bot/infrastructure/i18n.py" = ["RUF001", "E501"]
"bot/presentation/keyboards/*" = ["E501", "RUF001"]
"bot/presentation/handlers/*" = ["E501", "RUF001"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "bot.presentation.*"
disallow_untyped_defs = false
warn_return_any = false
disable_error_code = ["union-attr", "attr-defined", "no-any-return", "type-arg", "index", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "bot.main"
disallow_untyped_defs = false
disable_error_code = ["type-arg", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "telegram.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bot"]